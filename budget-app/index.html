<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <title>Pocket Budget</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">Pocket Budget</h1>
    <button id="export-btn" class="ghost small" type="button" hidden>Export Excel</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="home"   type="button"><span class="ico">◎</span>Home</button>
    <button data-tab="plan"   type="button"><span class="ico">⚖</span>Plan</button>
    <button data-tab="money"  type="button"><span class="ico">⇅</span>Money</button>
    <button data-tab="bills"  type="button"><span class="ico">↻</span>Bills</button>
    <button data-tab="debts"  type="button"><span class="ico">▤</span>Debts</button>
    <button data-tab="profile" type="button"><span class="ico">☺</span>Profile</button>
  </nav>

  <dialog id="sheet">
    <form method="dialog" id="sheet-form" novalidate></form>
  </dialog>

  <div id="toast" role="status"></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
